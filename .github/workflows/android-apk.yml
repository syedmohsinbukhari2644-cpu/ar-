name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.ts'
      - '**.tsx'
      - 'app.json'
      - 'android/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download official MediaPipe Face Landmarker model
        working-directory: android/app
        run: |
          mkdir -p src/main/assets
          curl --fail --location --retry 3 --output src/main/assets/face_landmarker.task \
            https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: beauty-camera-tester-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error